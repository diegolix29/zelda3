[General]
# Automatically save state on quit and reload on start
Autosave = 0
DisplayPerfInTitle = 0

# Extended aspect ratio, either 16:9, 16:10, or 18:9. 4:3 means normal aspect ratio.
# Add ", unchanged_sprites" to avoid changing sprite spawn/die behavior. Without this
# replays will be incompatible.
# Add ", no_visual_fixes" to avoid fixing some graphics glitches (for example with Cape).
# It won't affect replays/game behavior but the memory compare will not work.
# Add "extend_y, " right before the aspect radio specifier to display 240 lines instead of 224.
ExtendedAspectRatio = 4:3

# Disable the SDL_Delay that happens each frame (Gives slightly better perf if your
# display is set to exactly 60hz)
DisableFrameDelay = 0

# Set which language to use. Note. In order to use other languages you need to create
# the assets file appropriately.
# python restool.py --extract-dialogue -r german.sfc
# python restool.py --languages=de
# Language = de

[Graphics]
# Window size ( Auto or WidthxHeight )
WindowSize = Auto

# Fullscreen mode (0=windowed, 1=desktop fullscreen, 2=fullscreen w/mode change)
Fullscreen = 0

# Window scale (1=100%, 2=200%, 3=300%, etc.)
WindowScale = 3

# Use an optimized (but potentially more buggy) SNES PPU implementation
NewRenderer = 1

# Display the world map with higher resolution
EnhancedMode7 = 1

# Don't keep the aspect ratio
IgnoreAspectRatio = 0

# Enable this option to remove the sprite limits per scan line
NoSpriteLimits = 1

# Change the appearance of Link by loading a ZSPR file
# See all sprites here: https://snesrev.github.io/sprites-gfx/snes/zelda3/link/
# Download the files with "git clone https://github.com/snesrev/sprites-gfx.git"
# LinkGraphics = sprites-gfx/snes/zelda3/link/sheets/megaman-x.2.zspr

# Use either SDL, SDL-Software, OpenGL, or OpenGL ES as the output method
# SDL-Software rendering might give better performance on Raspberry pi.
OutputMethod = OpenGL

# Set to true to use linear filtering. Gives less crisp pixels. Works with SDL and OpenGL.
LinearFiltering = 0

# Set a glsl shader. Only supported with the OpenGL output method
# This can be the path to a .glsl or .glslp file
# Get them with: git clone https://github.com/snesrev/glsl-shaders
# HD improvements: Four Swords Adventures style painted look (needs OpenGL).
# Leave empty to play without it.
Shader = shaders/foursword/foursword.glslp

# Recreate the behavior of the Virtual Console releases, where flashing effects are lessened
DimFlashes = 0

# HD improvements
# Smooth camera: 0 = off, 1 = light, 2 = medium, 3 = strong
SmoothCamera = 2

# Redraw the dialogue box sharp on top of the shader (1 = on)
HdText = 1

# Displays above 60 Hz: the game keeps its normal speed and scrolling is
# interpolated in the extra frames (nothing changes at 60 Hz)
HighRefreshInterpolation = 0

# Dynamic lighting: glow around fire and dark rooms lit only by burning flames
DynamicLighting = 1

# Extra visual effects (1 = on)
# heat and flames: embers rising from torches, braziers, fire and lava, air
# shimmering above lava, indoor background animations at half speed
FxHeatAndFlames = 1
# light rays and floating dust from windows
FxWindowRays = 1
# ray glow when Link holds up a received item
FxItemGlow = 1
# denser rain, splashes and soft lightning
FxRain = 1
# water with depth, foam and moving surface; flowing waterfalls with mist
FxWater = 1
# blurred, darker game behind the inventory and menus; blurred inside dialogue boxes
FxMenuBlur = 1
# soft shadows under Link and walking enemies
FxSpriteShadows = 1
# soft edge on the circle transition (entering and leaving places)
FxSoftIris = 1
# on-screen hints for the buttons in the inventory and on the maps
FxButtonHints = 1
# teleport whirlpools give off magic sparkles (so they don't look like Zoras)
FxWhirlpoolGlow = 1
# official artwork look: Agahnim in red with blue skin, King of Hyrule in red
# in the ending, six-pointed star of the Japanese version on the floor medallion
# of the Eastern, Desert, Hera and Dark palaces
OfficialArtwork = 0
# blond Link, as in the official artwork (not applied to a custom Link,
# LinkGraphics)
BlondLink = 0

[Sound]
EnableAudio = 1

# DSP frequency in samples per second (e.g. 48000, 44100, 32000, 22050, 11025)
AudioFreq = 44100

# number of separate sound channels (1=mono, 2=stereo)
AudioChannels = 2

# Audio buffer size in samples (power of 2; e.g., 4096, 2048, 1024) [try 1024 if sound is crackly]. The higher the more lag before you hear sounds.
AudioSamples = 512

# Enable MSU support for audio. Supports MSU or MSU Deluxe in PCM or OPUZ format.
# OPUZ is around 10% of the size compared to PCM.
# PCM MSU requires AudioFreq = 44100 to work properly while OPUZ needs 48000.
# The following values are accepted: false, true, deluxe, opuz, deluxe-opuz
EnableMSU = false

# The path to the MSU files. The number and the file extension are appended automatically.
MSUPath = msu/alttp_msu-

# Remember MSU position and return back to the same position when entering
# an overworld area. (Only remembers one area)
ResumeMSU = 1

# Change the volume of the MSU playback, a value between 0-100
MSUVolume = 100%

[Features]
# Item switch on L/R. Also allows reordering of items in inventory by pressing Y+direction.
# Hold X, L, or R inside of the item selection screen to assign items to those buttons.
# If X is reassigned, Select opens the map. Push Select while paused to save or quit.
# When L or R are assigned items, those buttons will no longer cycle items.
ItemSwitchLR = 0

# Enable this to limit the ItemSwitchLR item cycling to the first 4 items.
ItemSwitchLRLimit = 0

# Allow turning while dashing
TurnWhileDashing = 0

# Allow mirror to be used to warp to the Dark World
MirrorToDarkworld = 0

# Swords and items behave like on GBA and interact with the world:
# every sword collects hearts, rupees, bombs, magic and arrows; from the Master
# Sword it breaks signs; the Gold Sword breaks pots; arrows break pots (silver
# arrows every pot on their path); the hammer breaks bushes and small rocks;
# the lamp and the fire rod cut grass, bushes and curtains, the lamp flame hurts
# the enemies in front of Link
SwordAndItemsInteraction = 1

# Enemy damage as on GBA: the values the GBA version changed (Ether, Bombos,
# Quake, hookshot, powder). Applied when the game starts
GbaEnemyDamage = 1

# Dive with the flippers, as on GBA: while swimming, B makes Link dive for a
# moment
FlipperDive = 1

# Hurricane Spin, as on GBA: once you have the Bug-Catching Net, hold the charge longer and
# the spin attack becomes long; press B while spinning to spin again (costs magic)
HurricaneSpin = 1

# Items refill resources (as on GBA): getting the Fire or Ice Rod, Lamp, Cane of
# Somaria or Byrna or Magic Cape refills your magic meter, the Master Sword also
# your hearts; the Bow comes with 10 arrows
ItemsRefillResources = 1

# Palace 6 as on GBA: the block puzzle of the Ice Palace (rooms 0x9E and 0xBE)
# is changed to match the GBA version. Set it from the launcher: it is read
# only when the game starts and cannot be changed in game
IcePalaceGba = 0

# The world physically reacts to fire and ice: the lamp and the fire rod set
# bushes and tall grass on fire and the fire spreads, the Bombos medallion burns
# everything on screen; the ice rod freezes bushes and grass on its line, the
# Ether medallion everything on screen (ice does not spread)
BurnAndFreezeInteraction = 1

# Arrows of Link and of the enemies stuck in walls stay there instead of
# vanishing
StuckArrows = 1

# Disable the low health beep
DisableLowHealthBeep = 0

# Save hearts and magic: "Save and quit" remembers the current hearts and magic
# instead of the restart ones; on the file select the unsaved hearts are black
SaveHeartsAndMagic = 1

# Avoid waiting too much at the start
SkipIntroOnKeypress = 0

# Display max rupees/bombs/arrows with orange/yellow color
ShowMaxItemsInYellow = 0

# Allows up to four bombs active at a time instead of two.
MoreActiveBombs = 0

# Can carry 9999 rupees instead of 999
CarryMoreRupees = 0

# Enable various zelda bug fixes
MiscBugFixes = 0

# Enable some more advanced zelda bugfixes that change game behavior
GameChangingBugFixes = 0

# Allow bird travel to be cancelled by hitting the X key
CancelBirdTravel = 0

# Ninth bird travel point: on the eastern summit of Death Mountain, on the
# plateau with the pegs above Turtle Rock
BirdTravelPoint9 = 1

# HD improvements
# Quick and smooth transitions between areas and rooms: Link keeps walking
FastTransitions = 0

# Continuous world outdoors: beyond the edge of an area you see the next
# areas, and the view follows Link up to the edge and across it
ContinuousWorld = 1

# Modern HUD: hearts and a thin magic bar top left, Y/A/B buttons top right
# with the item, the sword and the action of the A button (Talk, Read...),
# rupees and dungeon keys bottom left
ModernHud = 1

# Dungeon name in the middle of the screen when entering from outside, like on GBA
DungeonNames = 1

# Extended inventory with 6 columns like on GBA: four separate bottles, shovel
# and flute separate
ExtendedInventory = 1

# Improved world map: up to 24 markers with A, Y centers on Link, hold B to
# scroll faster
ImprovedWorldMap = 1

# Improved dungeon map: faster floor change
ImprovedDungeonMap = 1

# Progressive map: the map starts hidden and is uncovered by the player, one
# area at a time, where Link walks
ProgressiveMap = 1

# Show the items assigned to X, L and R in the HUD (requires ItemSwitchLR)
ShowXLRItemsInHud = 1

# Dialogue speed: 0 = original, 1 = fast while holding A or B, 2 = instant
TextSpeed = 1


[KeyMap]
# Change what keyboard keys map to the joypad
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R

# This default is suitable for QWERTY keyboards.
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v

# This default is suitable for QWERTZ keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, y, s, a, c, v

# This one is suitable for AZERTY keyboards.
#Controls = Up, Down, Left, Right, Right Shift, Return, x, w, s, q, c, v

CheatLife = w
CheatKeys = o
CheatWalkThroughWalls = Ctrl+e
ClearKeyLog = k
StopReplay = l
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
ReplayTurbo = t
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down

VolumeUp = Shift+=
VolumeDown = Shift+-

Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10
Replay= Ctrl+F1,Ctrl+F2,Ctrl+F3,Ctrl+F4,Ctrl+F5,Ctrl+F6,Ctrl+F7,Ctrl+F8,Ctrl+F9,Ctrl+F10

# Uncomment this to allow loading of reference saves
#LoadRef = 1,2,3,4,5,6,7,8,9,0,-,=,Backspace
#ReplayRef = Ctrl+1,Ctrl+2,Ctrl+3,Ctrl+4,Ctrl+5,Ctrl+6,Ctrl+7,Ctrl+8,Ctrl+9,Ctrl+0,Ctrl+-,Ctrl+=,Ctrl+Backspace

# Opens the HD options menu
HdMenu = Escape

[GamepadMap]
# Any keys used in KeyMap can be used also in this section.
# The shoulder button is called L1/Lb and L2, and the thumbstick button is called L3
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb

# Opens the HD options menu (right stick click)
HdMenu = R3
